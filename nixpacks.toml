# Railway/Render/Heroku configuration
[phases.setup]
nixPkgs = ["python311", "nodejs", "gcc"]
aptPkgs = ["ffmpeg"]

# Ensure Node.js is in PATH for yt-dlp signature solving
[phases.setup.nixPkgsOptions]
nodeVersion = "18"

[phases.install]
cmds = [
    "python -m venv --copies /opt/venv",
    "pip install -r requirements.txt",
    # Verify Node.js is accessible
    "which node || which nodejs",
    "node --version || nodejs --version",
    # Verify yt-dlp version
    "pip show yt-dlp"
]

[start]
cmd = "gunicorn integrated_app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 300"
