<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Analyzer - Find Viral Videos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff0050 0%, #ff4081 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .search-box {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .results-header {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .results-header h2 {
            color: #1976d2;
            margin-bottom: 10px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-color: #667eea;
        }

        .video-thumbnail {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .video-info {
            padding: 15px;
        }

        .video-rank {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .video-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-channel {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .video-stats {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .viral-score {
            background: #ffd700;
            color: #333;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: 600;
            text-align: center;
        }

        .error {
            display: none;
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            padding: 20px;
            border-radius: 5px;
            color: #721c24;
            margin-top: 20px;
        }

        .country-flag {
            font-size: 24px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 YouTube Video Analyzer</h1>
            <p>Find viral videos by country - Top ranked, high views</p>
        </div>

        <div class="content">
            <div class="search-box">
                <form id="searchForm">
                    <div class="form-row">
                        <div>
                            <label for="query">Search Query *</label>
                            <input
                                type="text"
                                id="query"
                                placeholder="e.g., cooking recipes, funny videos, tech reviews"
                                required
                            >
                        </div>
                        <div>
                            <label for="country">Country</label>
                            <select id="country">
                                {% for key, country in countries.items() %}
                                <option value="{{ key }}">{{ country.flag }} {{ country.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label for="limit">Number of Videos</label>
                            <input
                                type="number"
                                id="limit"
                                value="25"
                                min="10"
                                max="50"
                            >
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="searchBtn">
                        Search Videos
                    </button>
                </form>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Searching for videos...</p>
            </div>

            <div class="results" id="results">
                <div class="results-header">
                    <h2 id="resultsTitle"></h2>
                    <p id="resultsInfo"></p>
                </div>
                <div class="video-grid" id="videoGrid"></div>
            </div>

            <div class="error" id="error">
                <strong>❌ Error:</strong>
                <p id="errorMessage"></p>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('searchForm');
        const searchBtn = document.getElementById('searchBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const error = document.getElementById('error');
        const videoGrid = document.getElementById('videoGrid');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Reset UI
            loading.style.display = 'block';
            results.style.display = 'none';
            error.style.display = 'none';
            searchBtn.disabled = true;

            // Get form data
            const formData = {
                query: document.getElementById('query').value,
                country: document.getElementById('country').value,
                limit: document.getElementById('limit').value
            };

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Search failed');
                }

                // Show results
                displayResults(data);

            } catch (err) {
                showError(err.message);
            } finally {
                loading.style.display = 'none';
                searchBtn.disabled = false;
            }
        });

        function displayResults(data) {
            document.getElementById('resultsTitle').textContent =
                `Top ${data.total} Videos: "${data.query}"`;
            document.getElementById('resultsInfo').textContent =
                `Country: ${data.country} | Ranked by Viral Score`;

            videoGrid.innerHTML = '';

            data.videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => window.open(video.url, '_blank');

                card.innerHTML = `
                    <img src="${video.thumbnail}" alt="${video.title}" class="video-thumbnail">
                    <div class="video-info">
                        <span class="video-rank">#${video.rank}</span>
                        <div class="video-title">${video.title}</div>
                        <div class="video-channel">📺 ${video.channel}</div>
                        <div class="video-stats">
                            <span>👁️ ${video.views}</span>
                            <span>👍 ${video.likes}</span>
                            <span>💬 ${video.comments}</span>
                        </div>
                        <div class="video-stats">
                            <span>⏱️ ${video.duration}</span>
                            <span>📅 ${video.days_old} days ago</span>
                        </div>
                        <div class="viral-score">
                            🔥 Viral Score: ${video.viral_score}/100
                        </div>
                    </div>
                `;

                videoGrid.appendChild(card);
            });

            results.style.display = 'block';
        }

        function showError(message) {
            error.style.display = 'block';
            document.getElementById('errorMessage').textContent = message;
        }
    </script>
</body>
</html>
